version: '3.8'

services:
  # Base de Datos MySQL 8
  mysql:
    image: mysql:8.0
    container_name: tiendadiana-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-alexisvela123}
      MYSQL_DATABASE: ${DB_NAME:-tienda_diana_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Backend Node.js / Express
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tiendadiana-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-alexisvela123}
      DB_NAME: ${DB_NAME:-tienda_diana_db}
      JWT_SECRET: ${JWT_SECRET:-super_secreto_tiendadiana_jwt_key_2026_prod_secure}
      CORS_ORIGINS: "*"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5000:5000"

  # Frontend React (Nginx Web Server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tiendadiana-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:

